name: Build PS5-style Launcher PKG
on:
  workflow_dispatch:
  push:
    branches: [launcher-foundation]
    paths:
      - "ps4/launcher/**"
      - ".github/workflows/launcher-ps4.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 make python3 curl tar git
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Download OpenOrbis v0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -L --fail --retry 5 "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          LINKER_SCRIPT="$(find "$RUNNER_TEMP/openorbis" -name link.x -print -quit)"
          test -n "$LINKER_SCRIPT"
          TOOLCHAIN_DIR="$(dirname "$LINKER_SCRIPT")"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
      - name: Build GoldHEN SDK
        run: |
          git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          git -C "$RUNNER_TEMP/GoldHEN_Plugins_SDK" checkout bcea3c7ef01dac6d7f9f49ebf9e90fe66d86f5f7
          make -C "$RUNNER_TEMP/GoldHEN_Plugins_SDK" all OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" CC=clang-18 CCX=clang++-18 LD=ld.lld-18 AR=llvm-ar-18
          test -s "$RUNNER_TEMP/GoldHEN_Plugins_SDK/libGoldHEN_Hook.a"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"
      - name: Prepare package tools
        run: |
          curl -L --fail --retry 5 "https://github.archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb" -o "$RUNNER_TEMP/libssl1.1.deb"
          sudo dpkg -i "$RUNNER_TEMP/libssl1.1.deb"
          sudo ldconfig
          test -e /usr/lib/x86_64-linux-gnu/libssl.so.1.1
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
      - name: Build EBOOT
        run: make -C ps4/launcher clean all
      - name: Package
        run: |
          set -Eeuo pipefail
          set -x
          trap 'rc=$?; echo "FAILED at line $LINENO: $BASH_COMMAND (exit $rc)"; if [ -f pkg.gp4 ]; then echo "=== GP4 on failure ==="; cat pkg.gp4; fi; echo "=== files ==="; find . -maxdepth 4 -type f -printf "%p %s bytes\\n" | sort; exit $rc' ERR
          mkdir -p ps4/launcher/staging/sce_sys ps4/launcher/staging/sce_module ps4/launcher/out
          cp ps4/launcher/eboot.bin ps4/launcher/staging/eboot.bin
          RIGHT_SPRX="$(find "$RUNNER_TEMP/openorbis" -path "*/samples/piglet/sce_sys/about/right.sprx" -print -quit)"
          test -n "$RIGHT_SPRX" && test -s "$RIGHT_SPRX"
          mkdir -p ps4/launcher/staging/sce_sys/about
          cp "$RIGHT_SPRX" ps4/launcher/staging/sce_sys/about/right.sprx
          python3 - <<'PY'
          import struct,zlib
          S=512
          def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          rows=b''.join(b'\0'+bytes((12,18,28))*S for _ in range(S))
          png=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>2I5B',S,S,8,2,0,0,0))+ch(b'IDAT',zlib.compress(rows,9))+ch(b'IEND',b'')
          offset=8
          idat=bytearray()
          while offset < len(png):
              size=struct.unpack('>I',png[offset:offset+4])[0]
              kind=png[offset+4:offset+8]
              data=png[offset+8:offset+8+size]
              checksum=struct.unpack('>I',png[offset+8+size:offset+12+size])[0]
              assert zlib.crc32(kind+data)&0xffffffff == checksum
              if kind==b'IDAT': idat.extend(data)
              offset += 12+size
          assert offset==len(png) and png[:8]==b'\x89PNG\r\n\x1a\n'
          assert zlib.decompress(idat)==rows
          open('ps4/launcher/staging/sce_sys/icon0.png','wb').write(png)
          PY
          cd ps4/launcher/staging
          PKG="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          "$PKG" sfo_new sce_sys/param.sfo
          "$PKG" sfo_setentry sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
          "$PKG" sfo_setentry sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value 0.1.0
          "$PKG" sfo_setentry sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
          "$PKG" sfo_setentry sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value gd
          "$PKG" sfo_setentry sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value IV0000-LCHR00001_00-PS5LAUNCHER00001
          "$PKG" sfo_setentry sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
          "$PKG" sfo_setentry sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
          "$PKG" sfo_setentry sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value 'PS5 Style Launcher'
          "$PKG" sfo_setentry sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value LCHR00001
          "$PKG" sfo_setentry sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value 0.1.0
          "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4" -out pkg.gp4 --content-id=IV0000-LCHR00001_00-PS5LAUNCHER00001 --files 'eboot.bin sce_sys/about/right.sprx sce_sys/param.sfo sce_sys/icon0.png'
          echo "=== GP4 generated ==="
          test -s pkg.gp4
          cat pkg.gp4
          echo "=== Staged files ==="
          find . -maxdepth 4 -type f -printf '%p %s bytes\\n' | sort
          echo "=== Build PKG ==="
          "$PKG" pkg_build pkg.gp4 .
          PKG_FILE="$(find . -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG_FILE"
          mkdir -p ../out
          mv "$PKG_FILE" ../out/
          PKG_FILE="../out/$(basename "$PKG_FILE")"
          echo "=== Validate PKG ==="
          "$PKG" pkg_validate --verbose "$PKG_FILE"
          ls -lh "$PKG_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: PS5-LAUNCHER-PKG
          path: ps4/launcher/out/*.pkg
          if-no-files-found: error
