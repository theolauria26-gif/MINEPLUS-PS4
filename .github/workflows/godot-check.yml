name: Validate MINEPLUS Godot PCG
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "scenes/**"
      - "project.godot"
      - ".github/workflows/godot-check.yml"
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 headless
        run: |
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and parse project
        run: |
          output=$(Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit 2>&1)
          echo "$output"
          if echo "$output" | grep -E "SCRIPT ERROR|Failed to load script"; then exit 1; fi
      - name: Test persistent settings and mobile frame caps
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/tests/settings_test.gd
      - name: Test versioned world-save recovery
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/tests/world_save_test.gd
      - name: Test transactional crafting recipes
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/tests/crafting_test.gd
      - name: Test world lobby slot selection and save protection
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/tests/world_lobby_test.gd
      - name: Test deterministic 3D biome decorations
        run: |
          output=$(Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://scripts/tests/world_visual_test.gd --quit-after 120 2>&1)
          echo "$output"
          echo "$output" | grep -q "MINEPLUS world-visual tests: OK"
