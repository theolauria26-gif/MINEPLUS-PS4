name: Build MINEPLUS PS4 PKG
on:
  workflow_dispatch:
  push:
    paths:
      - "ps4/native/**"
      - "ps4/build-native.sh"
      - ".github/workflows/ps4-native.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make python3 curl tar
      - name: Install OpenSSL 1.1 compatibility for LibOrbisPkg
        run: |
          curl -L --fail --retry 3 "https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb" -o /tmp/libssl1.1.deb
          sudo dpkg -i /tmp/libssl1.1.deb
      - name: Install .NET runtime for LibOrbisPkg
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Download OpenOrbis v0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          LINKER_SCRIPT="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -print -quit)"
          test -n "$LINKER_SCRIPT"
          TOOLCHAIN_DIR="$(dirname "$LINKER_SCRIPT")"
          test -n "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "OpenOrbis root: $TOOLCHAIN_DIR"
          find "$TOOLCHAIN_DIR/bin/linux" -maxdepth 1 -type f -printf '%f\n' | sort | head -40
      - name: Fetch OpenOrbis compatibility module sources
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$RUNNER_TEMP/openorbis-source"
          echo "OO_PS4_MODULE_SOURCE_ROOT=$RUNNER_TEMP/openorbis-source" >> "$GITHUB_ENV"
      - name: Run portable procedural-world tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp \
            ps4/native/chunk_cache.cpp ps4/native/tests/pcg_tests.cpp -o "$RUNNER_TEMP/mineplus-pcg-tests"
          "$RUNNER_TEMP/mineplus-pcg-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/voxel_mesher.cpp ps4/native/tests/voxel_mesher_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-voxel-mesher-tests"
          "$RUNNER_TEMP/mineplus-voxel-mesher-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/material_atlas.cpp ps4/native/tests/material_atlas_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-material-atlas-tests"
          "$RUNNER_TEMP/mineplus-material-atlas-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/material_atlas.cpp ps4/native/procedural_material_atlas.cpp \
            ps4/native/tests/procedural_material_atlas_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-procedural-material-atlas-tests"
          "$RUNNER_TEMP/mineplus-procedural-material-atlas-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/voxel_face_uv.cpp ps4/native/tests/voxel_face_uv_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-voxel-face-uv-tests"
          "$RUNNER_TEMP/mineplus-voxel-face-uv-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/voxel_mesher.cpp ps4/native/voxel_face_uv.cpp \
            ps4/native/material_atlas.cpp ps4/native/voxel_mesh_vertices.cpp \
            ps4/native/tests/voxel_mesh_vertices_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-voxel-mesh-vertices-tests"
          "$RUNNER_TEMP/mineplus-voxel-mesh-vertices-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/dungeon_graph.cpp ps4/native/tests/dungeon_graph_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-dungeon-graph-tests"
          "$RUNNER_TEMP/mineplus-dungeon-graph-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/dungeon_graph.cpp ps4/native/dungeon_loot.cpp \
            ps4/native/tests/dungeon_loot_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-dungeon-loot-tests"
          "$RUNNER_TEMP/mineplus-dungeon-loot-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/voxel_mesher.cpp ps4/native/dungeon_graph.cpp \
            ps4/native/dungeon_voxel_builder.cpp ps4/native/tests/dungeon_voxel_builder_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-dungeon-voxel-builder-tests"
          "$RUNNER_TEMP/mineplus-dungeon-voxel-builder-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp ps4/native/chunk_cache.cpp \
            ps4/native/save_codec.cpp ps4/native/world_runtime.cpp \
            ps4/native/voxel_mesher.cpp ps4/native/material_atlas.cpp \
            ps4/native/voxel_face_uv.cpp ps4/native/voxel_mesh_vertices.cpp \
            ps4/native/voxel_mesh_indices.cpp ps4/native/procedural_voxel_chunk.cpp \
            ps4/native/voxel_gpu_upload.cpp ps4/native/tests/procedural_voxel_chunk_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-procedural-voxel-chunk-tests"
          "$RUNNER_TEMP/mineplus-procedural-voxel-chunk-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/material_atlas.cpp ps4/native/voxel_gpu_upload.cpp \
            ps4/native/tests/voxel_gpu_upload_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-voxel-gpu-upload-tests"
          "$RUNNER_TEMP/mineplus-voxel-gpu-upload-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp \
            ps4/native/chunk_cache.cpp ps4/native/tests/chunk_cache_tests.cpp -o "$RUNNER_TEMP/mineplus-cache-tests"
          "$RUNNER_TEMP/mineplus-cache-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp \
            ps4/native/chunk_cache.cpp ps4/native/save_codec.cpp \
            ps4/native/dungeon_graph.cpp ps4/native/dungeon_loot.cpp \
            ps4/native/world_runtime.cpp ps4/native/tests/world_runtime_tests.cpp -o "$RUNNER_TEMP/mineplus-runtime-tests"
          "$RUNNER_TEMP/mineplus-runtime-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp \
            ps4/native/chunk_cache.cpp ps4/native/save_codec.cpp \
            ps4/native/world_runtime.cpp ps4/native/tests/world_grid_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-grid-tests"
          "$RUNNER_TEMP/mineplus-grid-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/chunk_generator.cpp \
            ps4/native/chunk_cache.cpp ps4/native/save_codec.cpp \
            ps4/native/tests/save_codec_tests.cpp -o "$RUNNER_TEMP/mineplus-save-tests"
          "$RUNNER_TEMP/mineplus-save-tests"
      - name: Run surface ecology tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/surface_ecology.cpp ps4/native/tests/surface_ecology_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-surface-ecology-tests"
          "$RUNNER_TEMP/mineplus-surface-ecology-tests"
      - name: Run surface settlement tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/pcg_world.cpp ps4/native/surface_settlements.cpp \
            ps4/native/tests/surface_settlements_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-surface-settlement-tests"
          "$RUNNER_TEMP/mineplus-surface-settlement-tests"
      - name: Run surface NPC tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native ps4/native/surface_npcs.cpp ps4/native/tests/surface_npcs_tests.cpp -o "$RUNNER_TEMP/mineplus-surface-npc-tests"
          "$RUNNER_TEMP/mineplus-surface-npc-tests"
      - name: Run surface trade tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native ps4/native/surface_trade.cpp ps4/native/tests/surface_trade_tests.cpp -o "$RUNNER_TEMP/mineplus-surface-trade-tests"
          "$RUNNER_TEMP/mineplus-surface-trade-tests"
      - name: Run surface event tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/surface_events.cpp ps4/native/tests/surface_events_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-surface-event-tests"
          "$RUNNER_TEMP/mineplus-surface-event-tests"
      - name: Run surface quest tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/surface_quests.cpp ps4/native/tests/surface_quests_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-surface-quest-tests"
          "$RUNNER_TEMP/mineplus-surface-quest-tests"
      - name: Run equipment progression tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/equipment.cpp ps4/native/tests/equipment_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-equipment-tests"
          "$RUNNER_TEMP/mineplus-equipment-tests"
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/tests/weapon_abilities_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-weapon-art-tests"
          "$RUNNER_TEMP/mineplus-weapon-art-tests"
      - name: Run boss combat tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I ps4/native \
            ps4/native/boss_combat.cpp ps4/native/tests/boss_combat_tests.cpp \
            -o "$RUNNER_TEMP/mineplus-boss-combat-tests"
          "$RUNNER_TEMP/mineplus-boss-combat-tests"
      - name: Build native EBOOT and PKG
        run: |
          set -euxo pipefail
          chmod +x ps4/build-native.sh
          echo "Toolchain=$OO_PS4_TOOLCHAIN"
          ls -la "$OO_PS4_TOOLCHAIN"
          DOTNET_ROLL_FORWARD=Major bash -x ps4/build-native.sh
      - name: Upload installable PKG
        uses: actions/upload-artifact@v4
        with:
          name: MINEPLUS-PS4-PKG
          path: ps4/out/*.pkg
          if-no-files-found: error
