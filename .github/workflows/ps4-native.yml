name: Build MINEPLUS PS4 PKG
on:
  workflow_dispatch:
  push:
    paths:
      - "ps4/native/**"
      - "ps4/build-native.sh"
      - ".github/workflows/ps4-native.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make python3 curl tar
      - name: Install .NET runtime for LibOrbisPkg
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Download OpenOrbis v0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -L --fail --retry 3 "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          LINKER_SCRIPT="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -print -quit)"
          test -n "$LINKER_SCRIPT"
          TOOLCHAIN_DIR="$(dirname "$LINKER_SCRIPT")"
          test -n "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "OpenOrbis root: $TOOLCHAIN_DIR"
          find "$TOOLCHAIN_DIR/bin/linux" -maxdepth 1 -type f -printf '%f\n' | sort | head -40
      - name: Build native EBOOT and PKG
        run: |
          set -euxo pipefail
          chmod +x ps4/build-native.sh
          echo "Toolchain=$OO_PS4_TOOLCHAIN"
          ls -la "$OO_PS4_TOOLCHAIN"
          DOTNET_ROLL_FORWARD=Major bash -x ps4/build-native.sh
      - name: Upload installable PKG
        uses: actions/upload-artifact@v4
        with:
          name: MINEPLUS-PS4-PKG
          path: ps4/out/*.pkg
          if-no-files-found: error
